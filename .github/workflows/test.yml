name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Unit tests + validation of every docs/decision-log/ entry.
      # Uses only Node built-ins, so no install step is needed.
      - run: npm test
