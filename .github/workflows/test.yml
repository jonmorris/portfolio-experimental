name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Node's built-in test runner; no install step is needed.
      # (No test files at the moment, so this passes trivially.)
      - run: npm test
